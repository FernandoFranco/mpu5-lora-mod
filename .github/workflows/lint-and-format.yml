name: Lint & Format Check

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  lint-and-format:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run ESLint
        run: yarn lint

      - name: Check Prettier formatting
        run: yarn format:check

      - name: Check TypeScript types
        run: yarn typecheck

      - name: Check build
        run: yarn build

  lint-result:
    runs-on: ubuntu-24.04
    needs: lint-and-format
    if: failure()
    steps:
      - name: Report failure
        run: echo "Lint or format check failed. Please fix locally and push again."
        shell: bash
