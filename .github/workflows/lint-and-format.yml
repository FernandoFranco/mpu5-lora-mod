name: Lint & Format Check

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  lint-and-format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run ESLint
        run: yarn lint

      - name: Check Prettier formatting
        run: yarn format:check

      - name: Check TypeScript types
        run: yarn typecheck

      - name: Check build
        run: yarn build

  lint-result:
    runs-on: ubuntu-latest
    needs: lint-and-format
    if: failure()
    steps:
      - name: Report failure
        run: echo "Lint or format check failed. Please fix locally and push again."
        shell: bash
